connector:
  name: Testing AWS Connector Direct
  identifier: testing_aws_connector_direct
  description: AWS connector for CDK deployments with direct access
  orgIdentifier: default
  projectIdentifier: default_project
  type: Aws
  spec:
    credential:
      type: ManualConfig
      spec:
        accessKey: <+secrets.getValue("aws_access_key_id")>
        secretKey: <+secrets.getValue("aws_secret_access_key")>
    delegateSelectors:
      - harness-delegate
    executeOnDelegate: true
    region: us-east-1