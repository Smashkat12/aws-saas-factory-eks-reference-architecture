# Harness Secrets Configuration
# These secrets need to be created in Harness UI or via API

secrets:
  # AWS Credentials
  - name: aws_access_key_id
    identifier: aws_access_key_id
    description: AWS Access Key ID for CDK deployments
    type: SecretText
    projectIdentifier: default_project
    orgIdentifier: default
    # Value should be set via Harness UI or API
    
  - name: aws_secret_access_key
    identifier: aws_secret_access_key
    description: AWS Secret Access Key for CDK deployments
    type: SecretText
    projectIdentifier: default_project
    orgIdentifier: default
    # Value should be set via Harness UI or API
    
  - name: aws_account_id
    identifier: aws_account_id
    description: AWS Account ID for deployments
    type: SecretText
    projectIdentifier: default_project
    orgIdentifier: default
    # Value should be set via Harness UI or API
    
  # GitHub Credentials
  - name: github_pat
    identifier: github_pat
    description: GitHub Personal Access Token
    type: SecretText
    projectIdentifier: default_project
    orgIdentifier: default
    # Value should be set via Harness UI or API
    
  - name: github_username
    identifier: github_username
    description: GitHub Username
    type: SecretText
    projectIdentifier: default_project
    orgIdentifier: default
    # Value should be set via Harness UI or API
    
  # Application Secrets
  - name: datadog_api_key
    identifier: datadog_api_key
    description: Datadog API Key for monitoring
    type: SecretText
    projectIdentifier: default_project
    orgIdentifier: default
    # Value should be set via Harness UI or API

# Instructions for creating secrets via Harness API:
# 
# curl -X POST \
#   https://app.harness.io/gateway/ng/api/v2/secrets \
#   -H "x-api-key: YOUR_API_KEY" \
#   -H "Content-Type: application/json" \
#   -d '{
#     "secret": {
#       "type": "SecretText",
#       "name": "aws_access_key_id",
#       "identifier": "aws_access_key_id",
#       "orgIdentifier": "default",
#       "projectIdentifier": "default_project",
#       "spec": {
#         "secretManagerIdentifier": "harnessSecretManager",
#         "valueType": "Inline",
#         "value": "YOUR_AWS_ACCESS_KEY"
#       }
#     }
#   }'