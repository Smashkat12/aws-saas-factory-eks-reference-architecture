# Harness CDK Deployment Configuration
# Configuration for SaaS Factory EKS deployment via Harness CI/CD

deployment:
  email: smashkat12@gmail.com
  domain: thinkm8.co.uk
  hostedzone: Z0494651P0BXWLJV1MEX
  
# CDK specific parameters
cdk:
  region: us-east-1
  account: "${ACCOUNT_ID}"
  
# Application configuration
application:
  name: saas-factory-eks
  environment: "${ENV}"
  version: "${BUILD_NUMBER}"
  
# EKS Configuration
eks:
  cluster_name: "${CLUSTER_NAME:-saas-factory-cluster}"
  node_group_size: 3
  instance_type: t3.medium
  
# Monitoring and observability
monitoring:
  enabled: true
  datadog_api_key: "${DATADOG_API_KEY}"
  
# Security
security:
  enable_pod_security_policy: true
  enable_network_policy: true